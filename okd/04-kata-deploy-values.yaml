# Values for oci://ghcr.io/kata-containers/kata-deploy-charts/kata-deploy
# version 4.2.0, installed into namespace kata-deploy.

# Loads kata-deploy's SELinux policy module so the installer stages run
# confined on enforcing CoreOS nodes.
selinux:
  enabled: true

# nydus/erofs snapshotters are containerd-only; OKD runs CRI-O.
snapshotter:
  setup: []

# Rust runtime, the default since Kata 4.0. The Go shim "qemu" is
# being deprecated upstream.
shims:
  disableAll: true
  qemu-runtime-rs:
    enabled: true
    # Disk emptyDirs on a guest ext4 block device (block-plain) instead
    # of virtio-fs, with the block device on its own qemu iothread.
    # Measured against runc in performance/results/
    # 2026-10-11-2219-*: buffered 4k writes 0.14x -> 1.07x, 4k direct
    # writes 0.51x, 4k reads 0.87x, nested podman vfs build 4.2x ->
    # 1.5x. cache_direct makes guest O_DIRECT reach the disk. SCOS sets
    # kernel.io_uring_disabled=2, so the default aio "io_uring" fails
    # the hotplug; native needs cache_direct. The iothread halves the
    # fixed cost per 4k I/O for ~12% more node CPU under load.
    # Caveats (okd.md section 5): ext4 lazy init allocates ~0.08% of
    # the host filesystem per emptyDir, which counts against sizeLimit
    # and can evict idle pods (kata-containers#13310), and the guest
    # sees the host filesystem's size, not sizeLimit.
    dropIn: |
      [hypervisor.qemu]
      block_device_driver = "virtio-blk-pci"
      block_device_cache_direct = true
      block_device_aio = "native"
      enable_iothreads = true
      indep_iothreads = 1

      [runtime]
      emptydir_mode = "block-plain"

defaultShim:
  amd64: qemu-runtime-rs

# RuntimeClass "kata" pointing at the default shim, next to
# "kata-qemu-runtime-rs".
runtimeClasses:
  createDefault: true

nodeSelector:
  node-role.kubernetes.io/worker: ""

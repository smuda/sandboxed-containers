# Values for oci://ghcr.io/kata-containers/kata-deploy-charts/kata-deploy
# version 4.2.0, installed into namespace kata-deploy.

# Loads kata-deploy's SELinux policy module so the installer stages run
# confined on enforcing CoreOS nodes.
selinux:
  enabled: true

# nydus/erofs snapshotters are containerd-only; OKD runs CRI-O.
snapshotter:
  setup: []

# Rust runtime, the default since Kata 4.0. The Go shim "qemu" is
# being deprecated upstream.
shims:
  disableAll: true
  qemu-runtime-rs:
    enabled: true

defaultShim:
  amd64: qemu-runtime-rs

# RuntimeClass "kata" pointing at the default shim, next to
# "kata-qemu-runtime-rs".
runtimeClasses:
  createDefault: true

nodeSelector:
  node-role.kubernetes.io/worker: ""

# Opt-in RuntimeClass "kata-block-emptydir": qemu-runtime-rs with disk
# emptyDirs on a guest ext4 block device instead of virtio-fs. Buffered
# writes go from ~0.14x to ~1.1x runc and nested podman on vfs gets
# ~3x faster (performance/results/2026-10-10-1823-*). Not the default
# because ext4 lazy init allocates ~0.08% of the host filesystem per
# emptyDir, which counts against sizeLimit and can evict idle pods
# (kata-containers#13310), and the guest sees the host filesystem's
# size, not sizeLimit. SCOS sets kernel.io_uring_disabled=2, so the
# default block_device_aio="io_uring" fails the hotplug; native needs
# cache_direct=true. Overhead is inherited from qemu-runtime-rs.
customRuntimes:
  enabled: true
  runtimes:
    block-emptydir:
      baseConfig: qemu-runtime-rs
      dropIn: |
        [hypervisor.qemu]
        block_device_driver = "virtio-blk-pci"
        block_device_cache_direct = true
        block_device_aio = "native"

        [runtime]
        emptydir_mode = "block-plain"
      runtimeClass: |
        kind: RuntimeClass
        apiVersion: node.k8s.io/v1
        metadata:
          name: kata-block-emptydir
          labels:
            app.kubernetes.io/managed-by: kata-deploy
        handler: kata-block-emptydir
        scheduling:
          nodeSelector:
            katacontainers.io/kata-runtime: "true"

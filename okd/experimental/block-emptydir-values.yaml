# Experiment: put kata emptyDirs on a guest block device instead of
# virtio-fs.
#
# Over virtio-fs (cache=auto, no writeback) every guest write() is a
# round trip to virtiofsd, so buffered writes run at 0.13-0.14x runc and
# fio costs ~8x the node CPU. block-plain creates a sparse disk.img in
# the emptyDir, hot-plugs it and mounts it as ext4 in the guest, so the
# guest page cache absorbs writes.
#
# Caveats (kata 4.2.0 docs/Limitations.md): sizeLimit is ignored, the
# image is sized to the whole host filesystem, and the data is not
# visible from the host. cache_direct=true makes guest O_DIRECT reach
# the NVMe, so direct fio rows compare device against device.
#
# SCOS sets kernel.io_uring_disabled=2, so the default
# block_device_aio="io_uring" fails the hotplug; native needs
# cache_direct=true.
#
# Layer on top of the normal values; drop this file to revert:
#   helm upgrade kata-deploy oci://ghcr.io/kata-containers/kata-deploy-charts/kata-deploy \
#     --version 4.2.0 -n kata-deploy \
#     -f okd/04-kata-deploy-values.yaml -f okd/experimental/block-emptydir-values.yaml
shims:
  qemu-runtime-rs:
    dropIn: |
      [hypervisor.qemu]
      block_device_driver = "virtio-blk-pci"
      block_device_cache_direct = true
      block_device_aio = "native"

      [runtime]
      emptydir_mode = "block-plain"

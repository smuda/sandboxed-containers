# Installs okd/01-kata-deploy-crio-append.cil on every worker and loads
# it at priority 401 at boot, before CRI-O and kubelet. The data URL is
# generated from the .cil file; see okd.md section 3 to regenerate it.
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  name: 99-worker-kata-deploy-crio-append
  labels:
    machineconfiguration.openshift.io/role: worker
spec:
  config:
    ignition:
      version: 3.5.0
    storage:
      files:
        - path: /etc/kata-deploy-selinux/kata-deploy-crio-append.cil
          mode: 0644
          overwrite: true
          contents:
            source: data:text/plain;charset=utf-8;base64,
    systemd:
      units:
        - name: kata-deploy-crio-append.service
          enabled: true
          contents: |
            [Unit]
            Description=Load the kata-deploy CRI-O append SELinux module
            Before=crio.service kubelet.service

            [Service]
            Type=oneshot
            RemainAfterExit=yes
            ExecStart=/bin/sh -c 'cmp -s /etc/kata-deploy-selinux/kata-deploy-crio-append.cil /var/lib/kata-deploy-selinux/loaded.cil || { semodule -X 401 -i /etc/kata-deploy-selinux/kata-deploy-crio-append.cil && mkdir -p /var/lib/kata-deploy-selinux && cp /etc/kata-deploy-selinux/kata-deploy-crio-append.cil /var/lib/kata-deploy-selinux/loaded.cil; }'

            [Install]
            WantedBy=multi-user.target

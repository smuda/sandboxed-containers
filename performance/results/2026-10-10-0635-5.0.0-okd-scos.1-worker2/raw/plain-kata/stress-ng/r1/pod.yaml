apiVersion: v1
kind: Pod
metadata:
  name: bench-plain-kata-stressng-r1
  namespace: kata-bench
  annotations:
    openshift.io/required-scc: privileged
spec:
  serviceAccountName: bench
  automountServiceAccountToken: false
  restartPolicy: Never
  terminationGracePeriodSeconds: 0
  activeDeadlineSeconds: 7200
  # nodeName would skip the scheduler, which applies the RuntimeClass overhead.
  nodeSelector:
    kubernetes.io/hostname: "worker2.okd4.example.com"
  runtimeClassName: kata
  containers:
    - name: bench
      image: ghcr.io/colinianking/stress-ng:72a9d0cae0f420a887991d4024d3101c4af7a4fc@sha256:2ea9a7c3828eda1b1ca3d0b0c5a669ec252f9caf97a6a33aedcea6b2a66d1cbe
      command: ["sleep", "infinity"]
      resources:
        requests: {cpu: "4", memory: 4Gi}
        limits: {cpu: "4", memory: 4Gi}
      securityContext:
        runAsUser: 0
        privileged: false
      volumeMounts:
        - {name: data, mountPath: /bench}
  volumes:
    - name: data
      emptyDir: {sizeLimit: 3Gi}

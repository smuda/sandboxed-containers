apiVersion: node.k8s.io/v1
handler: kata
kind: RuntimeClass
metadata:
  finalizers:
  - kataconfig.openshift.io/runtime-class-cleanup
  name: kata
  ownerReferences:
  - apiVersion: kataconfiguration.openshift.io/v1
    blockOwnerDeletion: true
    controller: true
    kind: KataConfig
    name: example-kataconfig
overhead:
  podFixed:
    cpu: 250m
    memory: 350Mi
scheduling:
  nodeSelector:
    node-role.kubernetes.io/kata-oc: ""

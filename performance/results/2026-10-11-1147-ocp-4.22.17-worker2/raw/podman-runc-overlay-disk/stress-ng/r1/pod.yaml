apiVersion: v1
kind: Pod
metadata:
  name: bench-podman-runc-overlay-disk-stressng-r1
  namespace: kata-bench
  annotations:
    openshift.io/required-scc: privileged
spec:
  serviceAccountName: bench
  automountServiceAccountToken: false
  restartPolicy: Never
  terminationGracePeriodSeconds: 0
  activeDeadlineSeconds: 7200
  # nodeName would skip the scheduler, which applies the RuntimeClass overhead.
  nodeSelector:
    kubernetes.io/hostname: "worker2.okd4.example.com"
  containers:
    - name: bench
      image: quay.io/podman/stable:v5.8.7@sha256:74a13ba41b840e83926aa41017fe855c921bf466868f3464a85fc4af5c62503f
      command: ["sleep", "infinity"]
      resources:
        requests: {cpu: "4", memory: 4Gi}
        limits: {cpu: "4", memory: 4Gi}
      securityContext:
        runAsUser: 0
        privileged: true
      volumeMounts:
        - {name: data, mountPath: /var/lib/containers}
        - {name: storage-conf, mountPath: /etc/containers/storage.conf, subPath: storage.conf}
  volumes:
    - name: data
      emptyDir: {sizeLimit: 12Gi}
    - name: storage-conf
      configMap:
        name: storage-overlay

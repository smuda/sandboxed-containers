USER-SUPPLIED VALUES:
customRuntimes:
  enabled: true
  runtimes:
    block-emptydir:
      baseConfig: qemu-runtime-rs
      dropIn: |
        [hypervisor.qemu]
        block_device_driver = "virtio-blk-pci"
        block_device_cache_direct = true
        block_device_aio = "native"

        [runtime]
        emptydir_mode = "block-plain"
      runtimeClass: |
        kind: RuntimeClass
        apiVersion: node.k8s.io/v1
        metadata:
          name: kata-block-emptydir
          labels:
            app.kubernetes.io/managed-by: kata-deploy
        handler: kata-block-emptydir
        scheduling:
          nodeSelector:
            katacontainers.io/kata-runtime: "true"
defaultShim:
  amd64: qemu-runtime-rs
nodeSelector:
  node-role.kubernetes.io/worker: ""
runtimeClasses:
  createDefault: true
selinux:
  enabled: true
shims:
  disableAll: true
  qemu-runtime-rs:
    dropIn: |
      [hypervisor.qemu]
      block_device_driver = "virtio-blk-pci"
      block_device_cache_direct = true
      block_device_aio = "native"
      enable_iothreads = true
      indep_iothreads = 1

      [runtime]
      emptydir_mode = "block-plain"
    enabled: true
snapshotter:
  setup: []
